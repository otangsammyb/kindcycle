<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Messages — KindCycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    .chat-layout { display: flex; height: calc(100vh - var(--navbar-h)); margin-top: var(--navbar-h); background: var(--color-bg); }
    .chat-sidebar { width: 320px; border-right: 1px solid var(--color-border); background: white; overflow-y: auto; }
    .chat-main { flex: 1; display: flex; flex-direction: column; background: #faf8f5; }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--color-border); background: white; display: flex; align-items: center; gap: 12px; }
    .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .chat-input-area { padding: 16px 24px; border-top: 1px solid var(--color-border); background: white; display: flex; gap: 12px; }
    
    .convo-item { padding: 16px 24px; border-bottom: 1px solid var(--color-border-light); cursor: pointer; transition: background 0.1s; }
    .convo-item:hover { background: var(--color-bg-alt); }
    .convo-item.active { background: var(--color-secondary); border-left: 4px solid var(--color-accent); }
    
    .msg { max-width: 70%; padding: 10px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .msg.mine { background: var(--color-primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.theirs { background: white; border: 1px solid var(--color-border); align-self: flex-start; border-bottom-left-radius: 4px; }
  </style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="/" class="logo"><img src="/img/kindcycle.webp" alt="KindCycle" style="height:36px;width:auto;object-fit:contain"><span class="logo-text">KindCycle</span></a>
    <!-- Render links via JS based on role -->
    <div style="margin-left:auto"><button onclick="auth.logout()" class="btn btn-sm btn-ghost">Logout</button></div>
  </div>
</nav>

<div class="chat-layout">
  <aside class="chat-sidebar" id="convos-list">
    <div style="padding:24px;text-align:center;color:var(--color-text-muted)"><div class="spinner" style="margin:0 auto"></div></div>
  </aside>
  <main class="chat-main">
    <div class="chat-header" id="chat-header" style="opacity:0">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--color-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700" id="chat-partner-avatar">U</div>
      <div style="font-weight:700" id="chat-partner-name">User Name</div>
    </div>
    <div class="chat-messages" id="messages-list">
      <div style="margin:auto;color:var(--color-text-muted);text-align:center;max-width:300px">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;opacity:.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>Select a conversation from the sidebar to start messaging.</p>
      </div>
    </div>
    <form class="chat-input-area" id="chat-form" style="display:none">
      <input type="text" id="chat-input" class="form-input" style="flex:1" placeholder="Type a message..." required autocomplete="off" />
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
let currentPartnerId = null;
let currentItemId = null; // optional contextual item

document.addEventListener('DOMContentLoaded', () => {
  if (!auth.requireAuth()) return;
  
  // Parse incoming URL params in case a new chat is initiated
  const params = new URLSearchParams(window.location.search);
  const toUserId = params.get('user');
  currentItemId = params.get('item');
  
  if (toUserId) {
    loadChat(toUserId, 'User...'); 
  }
  
  loadConversations();
  
  // Basic polling every 5s for new messages if chat is open
  setInterval(() => {
    if (currentPartnerId) loadChat(currentPartnerId, document.getElementById('chat-partner-name').textContent, true);
  }, 5000);
});

const loadConversations = async () => {
  try {
    const res = await api.get('/chat/conversations');
    const list = document.getElementById('convos-list');
    
    // Inject a dummy convo if we are starting a brand new one and it's not in the list yet
    const convos = res.data;
    const params = new URLSearchParams(window.location.search);
    const toUserId = params.get('user');
    if (toUserId && !convos.find(c => c.partner._id === toUserId)) {
      convos.unshift({ partner: { _id: toUserId, name: 'New Contact' }, lastMessage: 'No messages yet', timestamp: new Date(), unread: 0 });
    }

    if (!convos.length) {
      list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--color-text-muted)">No active conversations.</div>`;
      return;
    }
    
    list.innerHTML = convos.map(c => `
      <div class="convo-item ${currentPartnerId === c.partner._id ? 'active' : ''}" onclick="loadChat('${c.partner._id}', '${c.partner.name}')">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-weight:700">${c.partner.name || 'Anonymous'}</span>
          <span style="font-size:.7rem;color:var(--color-text-muted)">${new Date(c.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>
        <div style="font-size:.85rem;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${c.lastMessage || '...'}
        </div>
        ${c.unread ? `<div style="margin-top:8px;background:var(--color-accent);color:white;font-size:.7rem;padding:2px 8px;border-radius:999px;display:inline-block">${c.unread} unread</div>` : ''}
      </div>
    `).join('');
  } catch(e) {}
};

const loadChat = async (partnerId, partnerName, isPolling = false) => {
  currentPartnerId = partnerId;
  document.getElementById('chat-header').style.opacity = '1';
  document.getElementById('chat-partner-name').textContent = partnerName;
  document.getElementById('chat-partner-avatar').textContent = partnerName[0].toUpperCase();
  document.getElementById('chat-form').style.display = 'flex';
  
  // Highlight active convo in sidebar
  document.querySelectorAll('.convo-item').forEach(el => el.classList.remove('active'));
  // Update sidebar without full reload if just switching
  if(!isPolling) loadConversations();
  
  try {
    const params = new URLSearchParams();
    if(currentItemId) params.append('item', currentItemId);
    
    const res = await api.get(`/chat/history/${partnerId}?${params}`);
    const msgs = res.data;
    const scrollEnd = !isPolling || document.getElementById('messages-list').scrollHeight - document.getElementById('messages-list').scrollTop <= document.getElementById('messages-list').clientHeight + 50;

    if (!msgs.length) {
      document.getElementById('messages-list').innerHTML = `<div style="margin:auto;color:var(--color-text-muted);text-align:center">Send a message to start chatting!</div>`;
      return;
    }

    const myId = auth.getUser()._id;
    document.getElementById('messages-list').innerHTML = msgs.map(m => `
      <div class="msg ${m.sender === myId ? 'mine' : 'theirs'}" title="${new Date(m.createdAt).toLocaleString()}">
        ${m.text}
      </div>
    `).join('');
    
    if (scrollEnd) {
      const list = document.getElementById('messages-list');
      list.scrollTop = list.scrollHeight;
    }
  } catch(e) {}
};

document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!currentPartnerId) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  
  try {
    await api.post('/chat', { receiverId: currentPartnerId, itemId: currentItemId, text });
    loadChat(currentPartnerId, document.getElementById('chat-partner-name').textContent);
  } catch(err) { alert(err.message); }
});
</script>
</body>
</html>
