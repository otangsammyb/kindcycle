<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — KindCycle</title>
  <meta name="description" content="Log in to your KindCycle account." />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-side">
    <div class="auth-side-content">
      <a href="/" class="logo" style="margin-bottom:32px;display:flex;align-items:center;gap:10px">
        <img src="/img/kindcycle.webp" alt="KindCycle" style="height:36px;width:auto;object-fit:contain">
        <span style="font-family:var(--font-display);font-size:1.5rem;font-weight:800;color:white">KindCycle</span>
      </a>
      <h2>Welcome back to the community</h2>
      <p>Continue making a difference. Your generosity matters.</p>
      <div class="auth-features">
        <div class="auth-feature"><span class="auth-feature-icon"><img src="/img/kindcycle.webp" alt="KindCycle" style="height:36px;width:auto;object-fit:contain">
        <span style="font-family:var(--font-display);font-weight:800;color:var(--color-primary)">KindCycle</span>
      </a>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-subtitle">Don't have an account? <a href="/register.html">Create one free</a></p>
      <form class="auth-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password <a href="#" style="float:right;font-size:.8rem;color:var(--color-primary)">Forgot?</a></label>
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="input-toggle" id="pw-toggle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">Sign in</button>
      </form>
      <div class="auth-footer">
        <span>Demo accounts: </span><br/>
        <small>Admin: admin@kindcycle.org / Admin@1234</small><br/>
        <small>Giver: sophie@example.com / Password@1</small>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Redirect if already logged in
  if (auth.isLoggedIn()) {
    const role = auth.getRole();
    window.location.href = role === 'admin' ? '/admin.html' : role === 'giver' ? '/dashboard-giver.html' : '/dashboard-receiver.html';
    return;
  }

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  // Toggle password
  document.getElementById('pw-toggle')?.addEventListener('click', () => {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.add('hidden');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) { errorEl.textContent = 'Please fill in all fields'; errorEl.classList.remove('hidden'); return; }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner spinner-sm"></div> Signing in...';
    try {
      const res = await api.post('/auth/login', { email, password });
      auth.setSession(res.data);
      showToast('Welcome back!', 'success');
      const next = new URLSearchParams(window.location.search).get('next');
      setTimeout(() => {
        window.location.href = next || getDashboardLink(res.data.user.role);
      }, 800);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
});
</script>
</body>
</html>
