<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Public Ledger — KindCycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    .ledger-card { background: white; border-radius: var(--radius-xl); border: 1px solid var(--color-border); padding: 24px; box-shadow: var(--shadow-sm); transition: transform 0.2s; }
    .ledger-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  </style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="container nav-inner">
    <a href="/" class="logo"><img src="/img/kindcycle.webp" alt="KindCycle" style="height:36px;width:auto;object-fit:contain"><span class="logo-text">KindCycle</span></a>
    <div class="nav-links" id="nav-links">
      <a href="/browse.html" class="nav-link">Browse</a>
      <a href="/ledger.html" class="nav-link active">Public Ledger</a>
    </div>
    <div class="nav-actions" id="nav-actions"><a href="/login.html" class="btn btn-ghost">Login</a><a href="/register.html" class="btn btn-primary">Get Started</a></div>
  </div>
</nav>

<div style="padding-top:calc(var(--navbar-h) + 40px);padding-bottom:80px" class="container">
  <div style="text-align:center;max-width:600px;margin:0 auto 48px auto">
    <h1 style="font-size:2.5rem;margin-bottom:16px;color:var(--color-primary)">Public Ledger of Kindness</h1>
    <p style="color:var(--color-text-muted);font-size:1.1rem">An open, transparent record of all items successfully given away on the KindCycle platform. Transparency ensures trust within our community.</p>
  </div>

  <div id="stats-banner" style="background:var(--color-primary);color:white;border-radius:var(--radius-xl);padding:32px;display:flex;align-items:center;justify-content:center;gap:48px;margin-bottom:48px;flex-wrap:wrap">
    <div style="text-align:center">
      <div style="font-size:3rem;font-weight:800;font-family:'Bricolage Grotesque'" id="total-donations">—</div>
      <div style="opacity:.8;text-transform:uppercase;letter-spacing:.05em;font-size:.875rem">Items Donated</div>
    </div>
    <div style="width:1px;height:60px;background:rgba(255,255,255,0.2)" class="stat-divider"></div>
    <div style="text-align:center">
      <div style="font-size:3rem;font-weight:800;font-family:'Bricolage Grotesque'" id="total-financial">—</div>
      <div style="opacity:.8;text-transform:uppercase;letter-spacing:.05em;font-size:.875rem">Financial Donations</div>
    </div>
  </div>

  <div id="ledger-list" style="display:grid;gap:24px">
    <div style="text-align:center;padding:64px;color:var(--color-text-muted)">
      <div class="spinner" style="margin:0 auto"></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await api.get('/ledger');
    document.getElementById('total-donations').textContent = res.data.totalDonations || 0;
    document.getElementById('total-financial').textContent = res.data.totalFinancial || 0;
    
    if(!res.data.ledger.length) {
      document.getElementById('ledger-list').innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div class="empty-title">No donations yet</div><div class="empty-desc">The ledger will log all items given successfully.</div></div>`;
      return;
    }

    document.getElementById('ledger-list').innerHTML = res.data.ledger.map(item => {
      if (item.ledgerType === 'donation') {
        return `
      <div class="ledger-card" style="display:flex;align-items:center;gap:24px">
        <div style="width:64px;height:64px;background:#fef3c7;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div style="flex:1">
          <h3 style="margin-bottom:4px;font-size:1.25rem">${item.title}</h3>
          <div style="color:var(--color-text-muted);font-size:.9rem">To: ${item.fundraiserTitle || 'Platform'}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:600;margin-bottom:4px">By ${item.giver?.name || 'Anonymous'}</div>
          <div style="font-size:.85rem;color:var(--color-text-muted)">${new Date(item.updatedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric'})}</div>
        </div>
      </div>`;
      } else {
        return `
      <div class="ledger-card" style="display:flex;align-items:center;gap:24px">
        <div style="width:64px;height:64px;background:var(--color-bg-alt);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div style="flex:1">
          <h3 style="margin-bottom:4px;font-size:1.25rem">${item.title}</h3>
          <div style="color:var(--color-text-muted);font-size:.9rem">Category: ${item.category}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:600;margin-bottom:4px">By ${item.giver?.name || 'Anonymous'}</div>
          <div style="font-size:.85rem;color:var(--color-text-muted)">${new Date(item.updatedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric'})}</div>
        </div>
      </div>`;
      }
    }).join('');

  } catch(e) {
    document.getElementById('ledger-list').innerHTML = `<div class="empty-state"><div class="empty-title">Could not load ledger.</div></div>`;
  }
});
</script>
</body>
</html>
